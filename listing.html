<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listing — CanvasCircle</title>

  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#0A1538" />

  <!-- Brand tokens. Single source of truth for colors across all pages.
       Loaded BEFORE the inline <style> block so vars are available. -->
  <link rel="stylesheet" href="/assets/theme.css" />

  <!-- Default OG tags; populated dynamically below once data loads. -->
  <meta property="og:type"        content="article" />
  <meta property="og:image"       content="https://canvascircle.art/assets/og-image.png" />
  <meta name="twitter:card"       content="summary_large_image" />

  <style>
    /* Color variables now live in /assets/theme.css (see <link> above). */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    a { color: var(--accent); }
    header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--card-line);
      background: var(--surface-1);
      display: flex; align-items: center; justify-content: space-between;
    }
    header .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); }
    header img    { height: 32px; width: 32px; border-radius: 6px; }
    header .title { font-weight: 600; font-size: 18px; letter-spacing: .2px; }
    nav a { color: var(--fg); text-decoration: none; margin-left: 16px; font-size: 14px; }
    nav a:hover { color: var(--accent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px;
    }

    #status {
      margin: 24px auto;
      max-width: 540px;
      padding: 12px 16px;
      border-radius: 8px;
      background: var(--surface-1);
      border: 1px solid var(--card-line);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    #status.error { color: var(--red); border-color: var(--status-danger-soft); background: var(--status-danger-tint); }

    .back { display: inline-block; margin: 12px 0; color: var(--muted); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--accent); }

    .listing {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 800px) {
      .listing { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; }
    }

    .gallery { display: flex; flex-direction: column; gap: 8px; }
    .gallery .main-img {
      width: 100%;
      aspect-ratio: 1/1;
      background: var(--border-soft);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
    }
    .gallery .main-img img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }

    /* Heart/save button on the listing image */
    .heart-btn {
      position: absolute;
      top: 12px; right: 12px;
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.94);
      color: var(--text-soft);
      border: none;
      border-radius: 999px;
      padding: 7px 13px 7px 12px;
      font: 600 14px inherit;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.18);
      transition: transform .12s ease, background .12s ease;
      z-index: 2;
    }
    .heart-btn:hover { transform: scale(1.04); background: var(--surface-1); }
    .heart-btn .heart-glyph { font-size: 18px; line-height: 1; }
    .heart-btn.is-saved { background: var(--surface-1); }
    .heart-btn.is-saved .heart-glyph { color: var(--status-danger-strong); }
    .heart-btn[disabled] { opacity: .55; cursor: progress; }
    .gallery .thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
    .gallery .thumbs img {
      width: 64px; height: 64px; object-fit: cover; border-radius: 6px;
      border: 1px solid var(--card-line); cursor: pointer;
    }
    .gallery .thumbs img.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(184,134,11,.2); }

    .details h1 { font-size: 22px; margin: 0 0 4px; }
    .details .artist { font-size: 18px; font-weight: 600; }
    .details .title  { font-size: 16px; color: var(--muted); margin-bottom: 12px; }

    .price-row {
      display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 14px;
    }
    .price        { font-size: 26px; font-weight: 700; }
    .prev-price   { color: var(--muted); text-decoration: line-through; font-size: 16px; }
    .price-drop   { color: var(--green); font-size: 13px; font-weight: 600; }

    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px;
      font-weight: 600; background: var(--accent-soft); color: var(--accent-deep); border: 1px solid var(--accent-soft);
    }
    .badge.status-sold      { background: var(--status-danger-soft); color: var(--status-danger-deep); border-color: var(--status-danger-soft); }
    .badge.status-pending   { background: var(--accent-soft); color: var(--accent-deep); border-color: var(--accent-soft); }
    .badge.status-available { background: var(--status-success-tint); color: var(--status-success-deep); border-color: var(--status-success-soft); }
    .badge.mood             { background: var(--badge-mood-bg); color: var(--badge-mood-fg); border-color: var(--badge-mood-border); }
    .badge.cat-unique       { background: var(--badge-unique-bg); color: var(--badge-unique-fg); border-color: var(--badge-unique-border); }
    .badge.cat-edition      { background: var(--badge-limited-bg); color: var(--badge-limited-fg); border-color: var(--badge-limited-border); }
    /* Verified badge sits alongside the category/status pills. Click/tap
       opens a small inline popover explaining what verification means.
       Phase 4: full brand gradient + NO border — borderless treatment
       reserved for trust badges so they feel premium and "lit from
       within" rather than outlined. */
    .badge.verified-badge {
      background: var(--brand-gradient);
      color: var(--text-inverse);
      border: none;
      cursor: pointer;
      user-select: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: filter .15s ease, box-shadow .15s ease;
    }
    .badge.verified-badge .vb-check { font-weight: 700; }
    .badge.verified-badge .vb-chev {
      font-size: 10px; opacity: .85; margin-left: 2px;
      transition: transform .2s ease;
      display: inline-block;
    }
    .badge.verified-badge[aria-expanded="true"] .vb-chev { transform: rotate(180deg); }
    .badge.verified-badge:hover,
    .badge.verified-badge:focus-visible {
      filter: brightness(1.10);
      box-shadow: 0 0 0 3px rgba(45,127,255,.30);
      outline: none;
    }
    /* Inline hint sits to the right of the badge so users don't have to
       guess whether the pill is interactive. Hidden visually when the
       popover is already open. */
    .verified-hint {
      display: inline-flex; align-items: center;
      font-size: 12px;
      color: var(--status-success-deep);
      margin-left: 4px;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }
    .verified-hint[hidden] { display: none; }
    .verified-popover {
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--status-success-tint);
      border: 1px solid var(--status-success-soft);
      border-radius: 8px;
      color: var(--status-success-deep);
      font-size: 13px;
      line-height: 1.5;
    }
    .verified-popover[hidden] { display: none; }
    .verified-popover strong { font-weight: 600; }
    .verified-popover .vp-when { color: var(--status-success); font-size: 12px; margin-top: 4px; }

    .meta {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 12px 0;
      box-shadow: var(--shadow);
    }
    .meta dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
    .meta dt { font-size: 13px; color: var(--muted); }
    .meta dd { font-size: 14px; margin: 0; }

    .section h3 { font-size: 14px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .section p  { margin: 0; white-space: pre-line; }

    .seller-block {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      padding: 16px;
      margin-top: 18px;
      box-shadow: var(--shadow);
    }
    .seller-block .seller-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 4px;
    }
    .seller-block .name { font-weight: 600; }
    .seller-block .loc  { color: var(--muted); font-size: 14px; margin-top: 2px; }

    /* Report-this-listing link — intentionally low-contrast so it doesn't
       distract from the listing or the contact buttons. */
    .report-link-row { margin-top: 18px; text-align: center; }
    .report-link {
      background: none; border: none; padding: 4px 8px;
      color: var(--muted); font-size: 11px;
      text-decoration: underline; cursor: pointer;
      font-family: inherit;
      letter-spacing: .2px;
    }
    .report-link:hover { color: var(--fg); }
    .seller-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    /* Both contact CTAs (Message on Facebook + Email Seller) share the
       blue single-hue gradient. Visual hierarchy comes from positioning,
       not from primary/secondary distinction — both are equally valid
       ways to reach the seller. */
    .seller-actions a {
      display: inline-block; padding: 9px 14px; border-radius: 8px;
      text-decoration: none; font-size: 14px; font-weight: 600;
      border: 1px solid var(--action-border);
      background: var(--action-bg);
      color: var(--action-fg);
      transition: filter .15s ease;
    }
    .seller-actions a:hover { filter: brightness(1.10); }

    .buying-tips-nudge {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--accent-softer);
      border: 1px solid var(--accent-soft);
      border-radius: 8px;
      font-size: 13px;
      color: var(--accent-deeper);
      line-height: 1.45;
    }
    .not-renewed-warning {
      margin: 0 0 14px;
      padding: 12px 14px;
      background: var(--accent-tint);
      border: 1px solid var(--accent-soft);
      border-radius: 10px;
      color: var(--accent-deeper);
      font-size: 14px;
      line-height: 1.5;
    }
    .not-renewed-warning strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .buying-tips-nudge a { color: var(--accent); font-weight: 600; }
    .buying-tips-nudge a:hover { text-decoration: underline; }

    /* Conspicuous "we're a venue, not a party" disclaimer above transaction
       buttons. Required to invoke the limitation-of-liability and dispute
       waivers in the Terms of Use. */
    .transaction-disclaimer {
      margin-top: 10px;
      padding: 10px 12px;
      background: var(--surface-3);
      border: 1px solid var(--card-line);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .transaction-disclaimer strong { color: var(--fg); }
    .transaction-disclaimer a { color: var(--accent); text-decoration: underline; }

    .listed-line { color: var(--muted); font-size: 13px; margin-top: 14px; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,.85);
      display: none; align-items: center; justify-content: center; z-index: 1000;
      padding: 16px; cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img  { max-width: 100%; max-height: 100%; object-fit: contain; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 16px;
      border-top: 1px solid var(--card-line);
      background: var(--surface-1);
      margin-top: 48px;
    }
  </style>
</head>
<body>

  <header>
    <a class="brand" href="/">
      <img src="/assets/logo-dark-bg.svg" alt="CanvasCircle" />
      <span class="title">CanvasCircle™</span>
    </a>
    <nav>
      <a href="/">Catalog</a>
      <a href="/portal/" class="cc-auth-link">Log In</a>
      <a href="/guidelines.html">Guidelines</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <script type="module" src="/lib/nav-auth.js"></script>

  <main>
    <a class="back" id="back-link" href="/">&larr; Back to catalog</a>
    <div id="status">Loading listing&hellip;</div>
    <div id="content" hidden></div>
  </main>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <img id="lightbox-img" src="" alt="" />
  </div>

  <footer>
    &copy; CanvasCircle.
    <a href="/about.html" style="color:inherit;">About</a> &middot;
    <a href="/guidelines.html" style="color:inherit;">Guidelines</a> &middot;
    <a href="/terms.html" style="color:inherit;">Terms</a> &middot;
    <a href="/privacy.html" style="color:inherit;">Privacy</a> &middot;
    <a href="/portal/" style="color:inherit;" class="cc-auth-link">Log In</a>
  </footer>

  <script type="module">
    import { supabase, publicImageUrl } from "/lib/supabase.js";
    import { getCurrentUserSaves, toggleSave } from "/lib/saves.js";
    import { showAuthPrompt } from "/lib/auth-prompt.js";
    import { armReturnTrail } from "/lib/return-trail.js";
    import { mountWelcomeBanner } from "/lib/welcome-banner.js";

    // See /lib/welcome-banner.js — renders the persistent "Continue to X"
    // banner for newly-signed-up users who haven't dismissed it yet.
    mountWelcomeBanner();

    // withTimeout — see notes in index.html. Hard-fails any hung Supabase
    // query so the loading state can't sit indefinitely.
    function withTimeout(promise, ms, label = "operation") {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(
          () => reject(new Error(`${label} timed out after ${ms}ms`)),
          ms
        )),
      ]);
    }

    const $status   = document.getElementById("status");
    const $content  = document.getElementById("content");
    const $lightbox = document.getElementById("lightbox");
    const $lbImg    = document.getElementById("lightbox-img");

    function getListingId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    // Smart back link — adapts based on where the user came from so the
    // "back" affordance returns them to that context instead of always
    // dumping them on the main catalog:
    //   - From /portal/ (own dashboard)        → "Back to your portal"
    //   - From /seller (a seller's public page) → "Back to @handle's page"
    //   - Anywhere else (or direct landing)     → "Back to catalog"
    // history.back() is used when available so scroll position is preserved;
    // the href is set as a fallback for opening in a new tab.
    (function setupBackLink() {
      const $back = document.getElementById("back-link");
      if (!$back) return;
      const refInfo = (() => {
        try {
          const r = document.referrer;
          if (!r) return null;
          const ru = new URL(r);
          if (ru.origin !== window.location.origin) return null;
          if (ru.pathname.startsWith("/portal")) {
            return { kind: "portal" };
          }
          if (ru.pathname.startsWith("/seller")) {
            // Seller page is /seller?handle=X. Pull the handle so we can
            // rebuild the exact URL for the fallback href.
            const handle = (ru.searchParams.get("handle") || "").trim();
            return { kind: "seller", handle };
          }
          return null;
        } catch { return null; }
      })();
      if (refInfo?.kind === "portal") {
        $back.textContent = "← Back to your portal";
        $back.href = "/portal/";
        $back.addEventListener("click", useHistoryBack("/portal/"));
      } else if (refInfo?.kind === "seller") {
        const handleLabel = refInfo.handle ? `@${refInfo.handle}` : "seller";
        $back.textContent = `← Back to ${handleLabel}'s page`;
        $back.href = refInfo.handle ? `/seller?handle=${encodeURIComponent(refInfo.handle)}` : "/";
        $back.addEventListener("click", useHistoryBack($back.href));
      }
      // Default (no smart branch matched): leave the hardcoded "Back to
      // catalog" link pointing at /.

      // Returns a click handler that prefers history.back() (preserves
      // scroll/state) but lets the user open in a new tab via cmd/ctrl-click
      // by not preventing default when modifier keys are held.
      function useHistoryBack(fallbackHref) {
        return (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
          // else: fall through to navigate to fallbackHref (the link's href)
        };
      }
    })();

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[c]));
    }

    function fmtPrice(n) {
      if (n == null || isNaN(Number(n))) return "—";
      return "$" + Number(n).toLocaleString();
    }

    function fmtDimensions(h, w, d) {
      const parts = [];
      if (h) parts.push(Number(h));
      if (w) parts.push(Number(w));
      if (d) parts.push(Number(d));
      if (!parts.length) return null;
      return parts.join(" × ") + " in";
    }

    function daysSince(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      const ms = Date.now() - d.getTime();
      return Math.max(0, Math.floor(ms / 86400000));
    }

    function statusBadge(status) {
      const map = {
        available:      "Available",
        pending:        "Pending Sale",
        sold:           "Sold",
        delisted:       "Delisted",
        not_renewed:    "Not renewed",
        pending_review: "Pending review",
        rejected:       "Rejected",
      };
      const cls = ["available", "pending", "sold"].includes(status) ? `status-${status}` : "";
      return { label: map[status] || status, cls };
    }

    function fbProfileUrl(url) {
      if (!url) return null;
      const trimmed = String(url).trim();
      if (!trimmed) return null;
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return "https://" + trimmed;
    }

    function setOgTags(listing, imgUrl) {
      const isIso = listing.listing_type === "iso";
      const subjectArtist = listing.artist_name || "any artist";
      const subjectTitle  = listing.artwork_title || "";
      const isoTitle = `In Search Of — ${subjectTitle ? `"${subjectTitle}"` : ""}${subjectTitle && listing.artist_name ? " by " : ""}${listing.artist_name || ""}`.replace(/\s+/g, " ").trim() || "In Search Of — buyer request";
      const saleTitle = `${listing.artist_name || "Artwork"} — ${listing.artwork_title || ""}`.trim();
      const title = isIso ? isoTitle : saleTitle;
      document.title = title + " — CanvasCircle";
      const setMeta = (prop, val) => {
        let el = document.querySelector(`meta[property="${prop}"]`);
        if (!el) {
          el = document.createElement("meta");
          el.setAttribute("property", prop);
          document.head.appendChild(el);
        }
        el.setAttribute("content", val);
      };
      setMeta("og:title", title);
      const defaultDesc = isIso
        ? `A buyer on CanvasCircle is looking to acquire ${subjectArtist}${subjectTitle ? ` — "${subjectTitle}"` : ""}.`
        : "An original or resold artwork on CanvasCircle.";
      setMeta("og:description", listing.description || defaultDesc);
      if (imgUrl) setMeta("og:image", imgUrl);
      setMeta("og:url", window.location.href);
    }

    // Auth-check timeout: on a cold PWA launch the network can be slow to
    // become ready and supabase.auth.getUser() can hang for 10-30s. We refuse
    // to block the listing render on that — anonymous viewers get a fully
    // usable listing page (just without contact info). The real auth check
    // keeps running in the background and re-renders when it resolves.
    const AUTH_TIMEOUT_MS = 3500;
    let __listingPatchedFromAuth = false;

    async function loadListing() {
      const id = getListingId();
      if (!id) {
        $status.textContent = "No listing id provided.";
        $status.classList.add("error");
        return;
      }

      // Detect auth state BEFORE the query. Anon callers can only SELECT a
      // narrow set of profile columns (see migration 016); requesting any of
      // the sensitive ones (location, facebook_profile_url, contact_email)
      // as anon would 403 the entire query. So build the column list
      // dynamically based on whether the viewer is signed in.
      const authLive = supabase.auth.getUser()
        .then(({ data }) => data?.user || null)
        .catch(() => null);
      const authTimer = new Promise((resolve) => setTimeout(() => resolve("__timeout__"), AUTH_TIMEOUT_MS));
      const authRaced = await Promise.race([authLive, authTimer]);
      const authTimedOut = (authRaced === "__timeout__");
      const viewer = authTimedOut ? null : authRaced;
      const signedIn = !!viewer;

      // If auth timed out but eventually does resolve with a real user,
      // re-render once so contact info shows up.
      if (authTimedOut && !__listingPatchedFromAuth) {
        authLive.then((u) => {
          if (u && !__listingPatchedFromAuth) {
            __listingPatchedFromAuth = true;
            loadListing();
          }
        }).catch(() => {});
      }
      const profileCols = signedIn
        ? "display_name, handle, location, facebook_profile_url, contact_email, account_status, is_trusted, about_text"
        : "display_name, handle, account_status";

      let listingResp, savesResp;
      try {
        [listingResp, savesResp] = await withTimeout(
          Promise.all([
            supabase
              .from("listings")
              .select(`
                listing_id, listing_type,
                artist_name, artwork_title, artwork_category, medium, year_created,
                height_in, width_in, depth_in, framed_size, condition_notes, provenance, description,
                asking_price_usd, previous_price_usd, price_updated_at,
                budget_min_usd, budget_max_usd,
                shipping_offered, coa_included, status, moderation_status,
                seller_mood, last_renewed_at, created_at, seller_id, save_count,
                verification_status, verified_at,
                listing_images ( storage_path, position ),
                profiles!listings_seller_id_fkey ( ${profileCols} )
              `)
              .eq("listing_id", id)
              .maybeSingle(),
            getCurrentUserSaves().catch(() => null),
          ]),
          12000,
          "listing query"
        );
      } catch (err) {
        console.error("[loadListing] failed:", err);
        $status.innerHTML = 'Could not load this listing. <a href="#" id="status-retry" style="text-decoration:underline; cursor:pointer;">Tap to retry.</a>';
        $status.classList.add("error");
        const $retry = document.getElementById("status-retry");
        if ($retry) $retry.addEventListener("click", (e) => {
          e.preventDefault();
          $status.classList.remove("error");
          $status.textContent = "Loading listing…";
          loadListing();
        });
        return;
      }
      const userSaves = savesResp; // Set or null
      const { data, error } = listingResp;

      if (error) {
        console.error(error);
        $status.textContent = "Could not load this listing. Please try again later.";
        $status.classList.add("error");
        return;
      }
      if (!data) {
        $status.textContent = "This listing isn't available.";
        return;
      }
      // Hide the listing if the seller's account isn't active. Admins viewing
      // their own seller's profile from the admin tab see this same gate —
      // they should manage suspended sellers from /portal/, not the public page.
      const sellerStatus = data.profiles?.account_status || "active";
      if (sellerStatus !== "active") {
        $status.textContent = "This listing isn't available.";
        return;
      }
      // Anonymous viewers see the listing but not the seller's identity or
      // contact info — they're prompted to sign in to reach out. (signedIn
      // is the auth state we computed up top, before issuing the query.)
      render(data, userSaves, signedIn);
      logListingView(data);

      // For unsigned viewers: arm the return-trail so the Sign in / Create
      // account CTAs drop them back on THIS listing after authentication.
      // Label uses artist + title so the post-signup banner is recognizable.
      if (!signedIn) {
        const title  = (data.artwork_title || "").trim();
        const artist = (data.artist_name || "").trim();
        let label = "the listing you were viewing";
        if (artist && title)   label = `${artist} — ${title}`;
        else if (artist)       label = `${artist}'s listing`;
        else if (title)        label = `"${title}"`;
        armReturnTrail(label);
      }

      // References are part of the seller block, which is signed-in only —
      // skip the extra query for anon viewers entirely.
      if (signedIn && data.seller_id) {
        loadAndRenderReferences(data.seller_id);
      }
    }

    async function loadAndRenderReferences(sellerUserId) {
      const { data: refs, error } = await supabase
        .from("seller_references")
        .select(`
          id,
          reference:profiles!seller_references_reference_user_id_fkey
            ( display_name, handle, is_trusted, account_status )
        `)
        .eq("seller_user_id", sellerUserId)
        .eq("status", "accepted");
      if (error) {
        console.warn("[refs] load failed:", error);
        return;
      }
      const valid = (refs || [])
        .filter(r => r.reference && r.reference.is_trusted && r.reference.account_status === "active");
      const $anchor = document.querySelector(".seller-block .seller-actions");
      if (!$anchor) return;
      // Inject a small references line right above the action buttons. Each
      // handle links to that seller's public page so a buyer can dig in.
      const wrap = document.createElement("div");
      wrap.style.cssText = "margin: 6px 0 10px; font-size: 13px; color: var(--muted);";
      if (valid.length === 0) {
        // Render nothing if the seller has no public references.
        return;
      }
      const links = valid.map(r => {
        const p = r.reference;
        return `<a href="/seller?handle=${encodeURIComponent(p.handle)}" style="color: var(--accent); text-decoration: none; font-weight: 600;">@${escapeHtml(p.handle)}</a>`;
      }).join(", ");
      wrap.innerHTML = `<strong style="color: var(--fg);">References:</strong> ${links} <span style="font-size: 12px;">— all are Established Members; reach out to ask about their experience.</span>`;
      $anchor.parentNode.insertBefore(wrap, $anchor);
    }

    // Log a single view of this listing — fire-and-forget, never blocks the
    // render. Skip if the current user IS the seller (we don't count owner
    // views). Anonymous viewers are tracked with a null user id.
    async function logListingView(listing) {
      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user && user.id === listing.seller_id) return;  // skip seller's own
        await supabase.from("listing_views").insert({
          listing_id:     listing.listing_id,
          viewer_user_id: user?.id || null,
        });
      } catch (e) {
        // Don't surface errors — view tracking is non-essential.
        console.warn("[view] log failed:", e);
      }
    }

    function render(l, userSaves, signedIn) {
      const isIso = l.listing_type === "iso";
      const images = (l.listing_images || []).slice().sort((a, b) => a.position - b.position);
      const imgUrls = images.map(i => publicImageUrl(i.storage_path)).filter(Boolean);
      const heroUrl = imgUrls[0] || "";

      const dims     = fmtDimensions(l.height_in, l.width_in, l.depth_in);
      const sb       = statusBadge(l.status);
      const days     = daysSince(l.created_at);
      const seller   = l.profiles || {};
      const fbUrl    = fbProfileUrl(seller.facebook_profile_url);
      const isSaved  = !!(userSaves && userSaves.has(l.listing_id));
      const saveCnt  = Number(l.save_count || 0);

      // ------ Price / budget block ------
      let priceBlock;
      if (isIso) {
        const min = l.budget_min_usd != null ? Number(l.budget_min_usd) : null;
        const max = l.budget_max_usd != null ? Number(l.budget_max_usd) : null;
        let budgetLabel;
        if (min != null && max != null)        budgetLabel = `$${min.toLocaleString()}–$${max.toLocaleString()}`;
        else if (min != null)                  budgetLabel = `From $${min.toLocaleString()}`;
        else if (max != null)                  budgetLabel = `Up to $${max.toLocaleString()}`;
        else                                   budgetLabel = `Open budget`;
        priceBlock = `
          <div class="price-row">
            <span class="budget-label" style="font-size:13px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-right:8px;">Buyer budget</span>
            <span class="price">${escapeHtml(budgetLabel)}</span>
          </div>`;
      } else {
        const priceDropped = l.previous_price_usd && Number(l.previous_price_usd) > Number(l.asking_price_usd);
        priceBlock = `
          <div class="price-row">
            <span class="price">${fmtPrice(l.asking_price_usd)}</span>
            ${priceDropped ? `<span class="prev-price">${fmtPrice(l.previous_price_usd)}</span><span class="price-drop">Price dropped</span>` : ""}
          </div>`;
      }

      // ------ Hero image: ISO without an image gets a placeholder card ------
      const heroBlock = heroUrl
        ? `<img id="hero" src="${heroUrl}" alt="" />`
        : (isIso
            ? `<div class="iso-hero-placeholder" style="aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--iso-placeholder-1) 0%,var(--iso-placeholder-2) 100%);color:var(--muted);gap:6px;border-radius:8px;">
                 <div style="font-size:48px;opacity:.55;">🔍</div>
                 <div style="font-size:14px;letter-spacing:.3px;">In Search Of</div>
                 <div style="font-size:12px;">No reference image provided</div>
               </div>`
            : "");

      // ------ Header text (artist / title) — ISO can have one or the other ------
      const artistLine = l.artist_name ? escapeHtml(l.artist_name)
                       : (isIso ? `<span style="color:var(--muted);font-style:italic;">Any artist</span>` : "Unknown artist");
      const titleLine  = l.artwork_title ? escapeHtml(l.artwork_title)
                       : (isIso ? `<span style="color:var(--muted);font-style:italic;">Title unspecified</span>` : "");

      // Verified badge — sits alongside the category/status pills. Anon
      // viewers never see seller-related info, so the badge is gated on
      // sign-in. Click → popover with the meaning copy. Verified-at date
      // is shown in the popover, not on the badge itself, to keep the
      // badge row compact.
      const verifiedAt = l.verified_at ? new Date(l.verified_at) : null;
      const verifiedAtStr = verifiedAt
        ? verifiedAt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })
        : "";
      const verifiedBadge = (signedIn && l.verification_status === "verified")
        ? `<span class="badge verified-badge" data-verified-popover tabindex="0" role="button"
                 aria-controls="verified-popover" aria-expanded="false"
                 aria-label="Ownership verified — tap to learn more">
             <span class="vb-check">✓</span> Ownership Verified
             <span class="vb-chev" aria-hidden="true">▾</span>
           </span>
           <span class="verified-hint" id="verified-hint" tabindex="0" role="button" aria-label="What does Ownership Verified mean?">What's this?</span>`
        : "";

      // ------ Badges row ------
      const badgesBlock = `
        <div class="badges">
          ${isIso ? `<span class="badge" style="background:var(--accent-tint);color:var(--accent-deep);border:1px solid var(--accent-soft);">WANTED</span>` : ""}
          ${l.artwork_category
            ? `<span class="badge ${l.artwork_category === "Unique/Original" ? "cat-unique"
                : l.artwork_category === "Limited Edition" ? "cat-edition" : ""}">${escapeHtml(l.artwork_category)}</span>`
            : ""}
          ${!isIso && l.status !== "available"
            ? `<span class="badge ${sb.cls}">${escapeHtml(sb.label)}</span>` : ""}
          ${!isIso && l.seller_mood ? `<span class="badge mood">${escapeHtml(l.seller_mood)}</span>` : ""}
          ${verifiedBadge}
        </div>`;

      // ------ Meta dl ------
      const metaBlock = isIso ? `
        <div class="meta">
          <dl>
            ${dims        ? `<dt>Desired Size (Inches)</dt><dd>${escapeHtml(dims.replace(/ in$/, ""))}</dd>` : ""}
            ${l.medium    ? `<dt>Medium</dt><dd>${escapeHtml(l.medium)}</dd>` : ""}
            ${l.year_created ? `<dt>Year</dt><dd>${escapeHtml(l.year_created)}</dd>` : ""}
          </dl>
        </div>` : `
        <div class="meta">
          <dl>
            ${dims        ? `<dt>Artwork Size (Inches)</dt><dd>${escapeHtml(dims.replace(/ in$/, ""))}</dd>` : ""}
            ${l.framed_size ? `<dt>Frame Size (Inches)</dt><dd>${escapeHtml(l.framed_size)}</dd>` : ""}
            ${l.medium    ? `<dt>Medium</dt><dd>${escapeHtml(l.medium)}</dd>` : ""}
            ${l.year_created ? `<dt>Year</dt><dd>${escapeHtml(l.year_created)}</dd>` : ""}
            <dt>Shipping included</dt><dd>${escapeHtml(l.shipping_offered || "—")}</dd>
            <dt>COA included</dt><dd>${escapeHtml(l.coa_included || "—")}</dd>
          </dl>
        </div>`;

      // ------ Optional sections — Condition/Provenance hidden for ISO ------
      const optionalSections = `
        ${!isIso && l.condition_notes ? `<div class="section"><h3>Condition</h3><p>${escapeHtml(l.condition_notes)}</p></div>` : ""}
        ${!isIso && l.provenance      ? `<div class="section"><h3>Provenance</h3><p>${escapeHtml(l.provenance)}</p></div>` : ""}
        ${l.description               ? `<div class="section"><h3>${isIso ? "Details from the buyer" : "Description"}</h3><p>${escapeHtml(l.description)}</p></div>` : ""}
      `;

      // ------ Counter-party block (seller for sale / buyer for ISO) ------
      // Anonymous viewers don't see identity or contact info — they get a
      // sign-in CTA instead. This keeps seller details private to actual
      // account holders and discourages drive-by browsing.
      const partyLabel    = isIso ? "Buyer"            : "Seller";
      const primaryCta    = isIso ? "Message on Facebook" : "Message on Facebook";
      const secondaryCta  = isIso ? "Email Buyer"       : "Email Seller";
      const inquirySubject = isIso
        ? `Re: your "In Search Of" listing on CanvasCircle`
        : `Inquiry about "${l.artwork_title || "your listing"}" on CanvasCircle`;

      // "Established Member" indicator — only on accounts the admin has
      // marked is_trusted. Small inline checkmark + plain text, not a badge/pill.
      const establishedRow = seller.is_trusted ? `
          <div class="established-member" style="display:inline-flex; align-items:center; gap:6px; margin-top:4px; padding:3px 11px; border-radius:999px; background:var(--brand-gradient); color:var(--text-inverse); font-size:13px; font-weight:600;">
            <svg width="14" height="14" viewBox="0 0 16 16" style="flex-shrink:0;" aria-hidden="true">
              <circle cx="8" cy="8" r="7" fill="#2a7a3e"/>
              <path d="M5 8.5 L7 10.5 L11 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            <span title="Reviewed by the admin; listings post without moderation">Established Member</span>
          </div>` : "";

      // About blurb (admin-approved). Renders only if the seller has set one.
      // Click "About this seller ▾" to expand inline; click again to collapse.
      // `white-space: pre-line` preserves the user's intentional line breaks
      // (paragraphs) but collapses other whitespace so the template literal's
      // own indentation doesn't bleed into the rendered output. The
      // interpolation also sits flush against the tags for the same reason.
      const aboutRow = seller.about_text ? `
          <div class="about-row" style="margin-top:6px;">
            <button type="button" id="about-toggle"
                    style="background:none; border:none; padding:0; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">
              About this seller <span id="about-toggle-glyph">▾</span>
            </button>
            <div id="about-text-panel" hidden style="margin-top:6px; padding:10px 12px; background:var(--surface-2); border:1px solid var(--card-line); border-radius:6px; font-size:13px; line-height:1.5; white-space:pre-line; color:var(--fg); text-align:left;">${escapeHtml(seller.about_text)}</div>
          </div>` : "";

      const counterpartyBlock = signedIn ? `
        <div class="seller-block">
          <div class="seller-label">${partyLabel}</div>
          <div class="name">${escapeHtml(seller.display_name || partyLabel)}${seller.handle ? ` <a href="/seller?handle=${encodeURIComponent(seller.handle)}" style="font-weight:400; color:var(--accent); font-size:13px; text-decoration:none;" title="View ${escapeHtml(seller.display_name || partyLabel)}'s public page">@${escapeHtml(seller.handle)}</a>` : ""}</div>
          ${establishedRow}
          ${aboutRow}
          ${seller.location ? `<div class="loc">${escapeHtml(seller.location)}</div>` : ""}
          <div class="seller-actions">
            ${fbUrl ? `<a class="primary" href="${fbUrl}" target="_blank" rel="noopener">${primaryCta}</a>` : ""}
            ${seller.contact_email ? `<a id="email-seller-link" href="#" target="_blank" rel="noopener">${secondaryCta}</a>` : ""}
          </div>
          ${(fbUrl || seller.contact_email) ? `
            <div class="buying-tips-nudge">
              Before you reach out — <a href="/guidelines.html" target="_blank" rel="noopener">read the ${isIso ? "guidelines" : "buying tips"} ↗</a> for a smoother, safer conversation.
            </div>` : ""}
          ${(fbUrl || seller.contact_email) ? `
            <div class="transaction-disclaimer">
              <strong>Heads up:</strong> CanvasCircle is a free listing platform. Any transaction is directly between you and the ${isIso ? "buyer" : "seller"}. CanvasCircle does not process payments, verify authenticity, or mediate disputes. See our <a href="/terms.html" target="_blank" rel="noopener">Terms</a>.
            </div>` : ""}
        </div>` : `
        <div class="seller-block" style="text-align:center;">
          <div class="seller-label">${partyLabel}</div>
          <div style="padding:16px 0; color:var(--muted); font-size:14px; line-height:1.5;">
            Sign in or create a free account to see the ${isIso ? "buyer's" : "seller's"} name and contact info.
          </div>
          <div class="seller-actions" style="justify-content:center;">
            <a class="primary" href="/portal/">Sign in</a>
            <a href="/portal/">Create account</a>
          </div>
        </div>`;

      $content.innerHTML = `
        <div class="listing">
          <div class="gallery">
            <div class="main-img">
              ${heroBlock}
              <button type="button" id="heart-btn" class="heart-btn${isSaved ? " is-saved" : ""}" aria-label="${isSaved ? "Unsave" : "Save listing"}">
                <span class="heart-glyph">${isSaved ? "♥" : "♡"}</span>
                <span class="heart-count">${saveCnt}</span>
              </button>
            </div>
            ${imgUrls.length > 1 ? `
              <div class="thumbs">
                ${imgUrls.map((u, i) => `<img data-idx="${i}" src="${u}" alt="" class="${i===0?'active':''}" />`).join("")}
              </div>` : ""}
          </div>
          <div class="details">
            <div class="artist">${artistLine}</div>
            <div class="title">${titleLine}</div>

            ${!isIso && l.status === "not_renewed" ? `
              <div class="not-renewed-warning">
                <strong>This listing hasn't been renewed in 60+ days.</strong>
                Availability is unknown — the seller may not respond promptly. Reach out to confirm the artwork is still for sale before committing.
              </div>` : ""}

            ${priceBlock}
            ${badgesBlock}
            ${verifiedBadge ? `
              <div class="verified-popover" id="verified-popover" hidden>
                <div><strong>This listing has been ownership verified.</strong></div>
                <div>The seller submitted a short video showing this artwork along with a handwritten card displaying their @handle and the date. CanvasCircle reviewed the video before adding this badge.</div>
                <div style="margin-top:6px;">Verification confirms <strong>physical possession</strong> only — it does not confirm authenticity of the artwork.</div>
                ${verifiedAtStr ? `<div class="vp-when">Verified on ${escapeHtml(verifiedAtStr)}.</div>` : ""}
              </div>` : ""}
            ${metaBlock}
            ${optionalSections}
            ${counterpartyBlock}

            ${days != null ? `<div class="listed-line">${isIso ? "Posted" : "Listed"} ${days === 0 ? "today" : days === 1 ? "1 day ago" : `${days} days ago`}.</div>` : ""}

            <div class="report-link-row">
              <button type="button" id="report-listing-btn" class="report-link" title="Report this listing">Report this listing</button>
            </div>
          </div>
        </div>
      `;

      // Stash for downstream code (email body builder, etc).
      render._inquirySubject = inquirySubject;
      render._isIso = isIso;

      $status.hidden = true;
      $content.hidden = false;

      // Wire the "About this seller" expand/collapse toggle.
      const $aboutToggle = document.getElementById("about-toggle");
      const $aboutPanel  = document.getElementById("about-text-panel");
      const $aboutGlyph  = document.getElementById("about-toggle-glyph");
      if ($aboutToggle && $aboutPanel && $aboutGlyph) {
        $aboutToggle.addEventListener("click", () => {
          const willShow = $aboutPanel.hidden;
          $aboutPanel.hidden = !willShow;
          $aboutGlyph.textContent = willShow ? "▴" : "▾";
        });
      }

      // Wire up gallery interactions
      const hero = document.getElementById("hero");
      if (hero) {
        hero.addEventListener("click", () => {
          $lbImg.src = hero.src;
          $lightbox.classList.add("open");
        });
      }
      $content.querySelectorAll(".thumbs img").forEach(t => {
        t.addEventListener("click", () => {
          const idx = Number(t.dataset.idx || 0);
          const url = imgUrls[idx];
          if (url && hero) {
            hero.src = url;
            $content.querySelectorAll(".thumbs img").forEach(x => x.classList.remove("active"));
            t.classList.add("active");
          }
        });
      });

      // Email mailto — built dynamically with listing context so the
      // recipient's mail client opens with subject + body prefilled.
      const $emailLink = document.getElementById("email-seller-link");
      if ($emailLink && seller.contact_email) {
        const subject = render._inquirySubject;
        const subjectLine = isIso
          ? `your "In Search Of" listing on CanvasCircle`
          : `your listing on CanvasCircle`;
        const subjectArtwork = (l.artwork_title || (isIso ? "the piece you're looking for" : "Untitled"))
          + (l.artist_name ? " by " + l.artist_name : "");
        const body =
          `Hi ${seller.display_name || ""},\n\n` +
          (isIso
            ? `I saw your post on CanvasCircle and I think I may have something that fits what you're looking for:\n`
            : `I'm interested in your listing on CanvasCircle:\n`) +
          `${subjectArtwork}\n` +
          `${window.location.href}\n\n` +
          `[Your message here]\n\n` +
          `Thanks!`;
        const mailto =
          "mailto:" + encodeURIComponent(seller.contact_email) +
          "?subject=" + encodeURIComponent(subject) +
          "&body=" + encodeURIComponent(body);
        $emailLink.href = mailto;
      }

      // Heart / save button
      const $heart = document.getElementById("heart-btn");
      if ($heart) {
        $heart.addEventListener("click", async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) {
            showAuthPrompt({ message: "Sign up to save listings. Same account also lets you sell — no commitment." });
            return;
          }
          $heart.disabled = true;
          const $glyph = $heart.querySelector(".heart-glyph");
          const $count = $heart.querySelector(".heart-count");
          const wasSaved = $heart.classList.contains("is-saved");
          // Optimistic UI
          $heart.classList.toggle("is-saved", !wasSaved);
          $glyph.textContent = !wasSaved ? "♥" : "♡";
          $count.textContent = String(Math.max(0, Number($count.textContent || 0) + (wasSaved ? -1 : 1)));
          try {
            await toggleSave(l.listing_id);
          } catch (err) {
            console.error("[heart] toggle failed:", err);
            // Revert
            $heart.classList.toggle("is-saved", wasSaved);
            $glyph.textContent = wasSaved ? "♥" : "♡";
            $count.textContent = String(Math.max(0, Number($count.textContent || 0) + (wasSaved ? 1 : -1)));
          } finally {
            $heart.disabled = false;
          }
        });
      }

      // Report-this-listing button — minimal, low-contrast link near footer.
      // Verified badge popover — tap the badge OR the "What's this?" hint to
      // expand the explanation. Chevron rotates and aria-expanded flips so
      // the badge looks like a real disclosure widget instead of a passive pill.
      const $verifiedBtn  = document.querySelector("[data-verified-popover]");
      const $verifiedHint = document.getElementById("verified-hint");
      const $verifiedPop  = document.getElementById("verified-popover");
      function toggleVerifiedPopover() {
        if (!$verifiedPop) return;
        const willOpen = $verifiedPop.hidden;
        $verifiedPop.hidden = !willOpen;
        if ($verifiedBtn)  $verifiedBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
        if ($verifiedHint) $verifiedHint.hidden = willOpen;  // hide the hint once they've discovered it
      }
      if ($verifiedBtn && $verifiedPop) {
        $verifiedBtn.addEventListener("click", toggleVerifiedPopover);
        $verifiedBtn.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleVerifiedPopover();
          }
        });
      }
      if ($verifiedHint && $verifiedPop) {
        $verifiedHint.addEventListener("click", toggleVerifiedPopover);
        $verifiedHint.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleVerifiedPopover();
          }
        });
      }

      // Signed-in only (prevents anonymous spam). One report per user per
      // listing is enforced by a DB unique constraint.
      const $reportBtn = document.getElementById("report-listing-btn");
      if ($reportBtn) {
        $reportBtn.addEventListener("click", async () => {
          const { data: { user } } = await supabase.auth.getUser();
          if (!user) {
            alert("You need to sign in to report a listing. Sign in or create a free account, then come back to report.");
            return;
          }
          const reason = prompt(
            "Why does this listing violate the community rules?\n\n" +
            "Be specific — counterfeit, misleading description, stock photo, prohibited content, etc. " +
            "The admin reviews every report.",
            ""
          );
          if (reason === null) return;
          const trimmed = reason.trim();
          if (!trimmed) {
            alert("A reason is required so the admin knows what to look at.");
            return;
          }
          try {
            const { error } = await supabase.from("listing_reports").insert({
              listing_id: l.listing_id,
              reporter_id: user.id,
              reason: trimmed,
            });
            if (error) {
              // Unique-constraint violation → user already reported this listing.
              if (String(error.code) === "23505" || /duplicate key/i.test(error.message || "")) {
                alert("You've already reported this listing. The admin sees your report in the queue.");
                return;
              }
              throw error;
            }
            alert("Thanks — the admin will review your report. You won't be notified individually but action (if any) happens directly on the listing.");
          } catch (err) {
            console.error("[report-listing] failed:", err);
            alert("Could not submit the report: " + (err.message || err));
          }
        });
      }

      setOgTags(l, heroUrl);
    }

    $lightbox.addEventListener("click", () => $lightbox.classList.remove("open"));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") $lightbox.classList.remove("open");
    });

    // ---------------------------------------------------------------------
    // Freshness watchdog — re-runs loadListing() when the page is restored
    // from bfcache or when the user returns to the tab/standalone-PWA after
    // >20s of being hidden. Without this, iOS / Android home-screen "app"
    // mode can freeze the page in a stale state. Mirrors the same pattern
    // in index.html, seller.html, and portal/index.html.
    // ---------------------------------------------------------------------
    let __lastLoadAt = 0;
    let __loadInFlight = false;
    async function refreshListingIfStale(force) {
      if (__loadInFlight) return;
      const ageMs = Date.now() - __lastLoadAt;
      if (!force && ageMs < 20000) return;
      __loadInFlight = true;
      try { await loadListing(); __lastLoadAt = Date.now(); }
      finally { __loadInFlight = false; }
    }
    window.addEventListener("pageshow", (e) => {
      if (e.persisted) refreshListingIfStale(true);
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") refreshListingIfStale(false);
    });

    (async () => { await loadListing(); __lastLoadAt = Date.now(); })();
  </script>
</body>
</html>
