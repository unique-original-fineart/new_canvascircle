<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CanvasCircle — Original & Resold Fine Art</title>

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#1a1a1a" />

  <!-- Open Graph -->
  <meta property="og:title"       content="CanvasCircle — Original & Resold Fine Art" />
  <meta property="og:description" content="A curated catalog of original and resold fine art from independent collectors and artists." />
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://canvascircle.art" />
  <meta property="og:image"       content="https://canvascircle.art/assets/og-image.png" />
  <meta name="twitter:card"       content="summary_large_image" />

  <style>
    :root {
      --bg:        #faf9f6;
      --fg:        #1a1a1a;
      --muted:     #6b6b6b;
      --accent:    #b8860b;
      --card-bg:   #ffffff;
      --card-line: #e8e4dc;
      --shadow:    0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
      --green:     #2a7a3e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--card-line);
      background: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .brand { display: flex; align-items: center; gap: 10px; }
    header img    { height: 32px; width: 32px; border-radius: 6px; }
    header .title { font-weight: 600; font-size: 18px; letter-spacing: .2px; }
    nav a { color: var(--fg); text-decoration: none; margin-left: 16px; font-size: 14px; }
    nav a:hover { color: var(--accent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    .hero {
      text-align: center;
      padding: 32px 16px 24px;
    }
    .hero h1 { margin: 0 0 8px; font-size: 28px; }
    .hero p  { margin: 0; color: var(--muted); }

    /* ---- Filter toolbar ---- */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toolbar-row {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    .toolbar-row.search-row {
      grid-template-columns: 1fr auto;
    }
    .toolbar-row.filter-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (min-width: 720px) {
      .toolbar-row.filter-row {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }
    }
    .price-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      grid-column: span 2;
    }
    @media (min-width: 720px) {
      .price-pair { grid-column: span 2; }
    }
    .toolbar input[type="search"],
    .toolbar input[type="number"],
    .toolbar select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-line);
      background: #fff;
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      appearance: none;
      -webkit-appearance: none;
    }
    .toolbar input[type="number"] { -moz-appearance: textfield; }
    .toolbar input[type="number"]::-webkit-outer-spin-button,
    .toolbar input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .toolbar input:focus,
    .toolbar select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184,134,11,.15);
    }
    .toolbar select {
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%23666' d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 8px center;
      padding-right: 28px;
    }
    .toolbar .clear-btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-line);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      white-space: nowrap;
    }
    .toolbar .clear-btn:hover {
      color: var(--fg);
      border-color: #ccc;
    }
    .stats {
      color: var(--muted);
      font-size: 13px;
      padding: 0 4px 12px;
    }

    /* ---- Status / empty ---- */
    #status, .empty {
      margin: 24px auto;
      max-width: 540px;
      padding: 16px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--card-line);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    #status.error { color: #a8281f; border-color: #f1c4be; background: #fef6f5; }
    .empty .empty-title { color: var(--fg); font-weight: 600; margin-bottom: 4px; }

    /* ---- Grid + cards ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 720px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
    }
    .card .img { aspect-ratio: 1/1; background: #f0ede6; overflow: hidden; position: relative; }
    .card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .body { padding: 10px 12px 12px; }
    .card .artist { font-weight: 600; font-size: 14px; line-height: 1.3; }
    .card .title  { color: var(--muted); font-size: 13px; margin-top: 2px;
                    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
                    -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
    .card .price-row {
      margin-top: 6px;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .card .price  { font-weight: 600; font-size: 14px; }
    .card .prev   { color: var(--muted); text-decoration: line-through; font-size: 12px; margin-left: 6px; }
    .card .cat    {
      font-size: 10px; font-weight: 700; letter-spacing: .3px;
      padding: 3px 7px; border-radius: 999px;
      background: #efe9d8; color: #6a4c00; border: 1px solid #e3d8b1;
      white-space: nowrap;
    }
    .card .cat.unique { background: #d6efdf; color: #1f5b32; border-color: #a8d9b8; }
    /* On very narrow cards, allow the badge to drop under the price */
    @media (max-width: 460px) {
      .card .price-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    }

    /* Sold overlay */
    .card.is-sold .img::after {
      content: "SOLD";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(168, 40, 31, .55);
      color: #fff;
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 4px;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .card.is-sold .price { color: var(--muted); text-decoration: line-through; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 16px;
      border-top: 1px solid var(--card-line);
      background: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/assets/CanvasCircleLogo.png" alt="CanvasCircle" />
      <span class="title">CanvasCircle</span>
    </div>
    <nav>
      <a href="/">Catalog</a>
      <a href="/portal/">Sell</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Original &amp; resold fine art</h1>
      <p>A curated catalog from independent collectors and artists.</p>
    </section>

    <form class="toolbar" id="toolbar" autocomplete="off">
      <div class="toolbar-row search-row">
        <input type="search" id="q" placeholder="Search artist or title&hellip;" />
        <button type="button" class="clear-btn" id="clear">Clear</button>
      </div>
      <div class="toolbar-row filter-row">
        <select id="f-category" title="Category">
          <option value="">All categories</option>
          <option value="Unique/Original">Unique/Original</option>
          <option value="Limited Edition">Limited Edition</option>
        </select>
        <select id="f-status" title="Status">
          <option value="">Available &amp; sold</option>
          <option value="available">Available only</option>
          <option value="sold">Sold only</option>
        </select>
        <select id="f-seller" title="Seller">
          <option value="">All sellers</option>
        </select>
        <select id="f-artist" title="Artist">
          <option value="">All artists</option>
        </select>
        <div class="price-pair">
          <input type="number" id="f-min" placeholder="Min $" min="0" step="50" />
          <input type="number" id="f-max" placeholder="Max $" min="0" step="50" />
        </div>
        <select id="f-sort" title="Sort">
          <option value="newest">Newest first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </form>

    <div id="stats" class="stats" hidden></div>
    <div id="status">Loading catalog&hellip;</div>
    <div id="grid" class="grid" hidden></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-title">No listings match your filters</div>
      <div>Try clearing one or two of them.</div>
    </div>
  </main>

  <footer>
    &copy; CanvasCircle. <a href="/about.html" style="color:inherit;">About</a> &middot;
    <a href="/portal/" style="color:inherit;">Seller portal</a>
  </footer>

  <script type="module">
    import { supabase, publicImageUrl } from "/lib/supabase.js";

    const $status = document.getElementById("status");
    const $grid   = document.getElementById("grid");
    const $empty  = document.getElementById("empty");
    const $stats  = document.getElementById("stats");
    const $q      = document.getElementById("q");
    const $cat    = document.getElementById("f-category");
    const $statusF= document.getElementById("f-status");
    const $seller = document.getElementById("f-seller");
    const $artist = document.getElementById("f-artist");
    const $min    = document.getElementById("f-min");
    const $max    = document.getElementById("f-max");
    const $sort   = document.getElementById("f-sort");
    const $clear  = document.getElementById("clear");

    let allListings = [];

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[c]));
    }

    function renderCard(listing) {
      const images = (listing.listing_images || []).slice().sort((a,b) => a.position - b.position);
      const firstPath = images[0]?.storage_path;
      const card = document.createElement("a");
      card.className = "card" + (listing.status === "sold" ? " is-sold" : "");
      card.href = `/listing.html?id=${listing.listing_id}`;
      const imgUrl = firstPath ? publicImageUrl(firstPath) : "";
      const price  = Number(listing.asking_price_usd || 0).toLocaleString();
      const prev   = listing.previous_price_usd
                      && Number(listing.previous_price_usd) > Number(listing.asking_price_usd)
                      ? Number(listing.previous_price_usd).toLocaleString()
                      : null;
      const catCls   = listing.artwork_category === "Unique/Original" ? " unique" : "";
      const catLabel = listing.artwork_category || "";
      card.innerHTML = `
        <div class="img">${imgUrl ? `<img src="${imgUrl}" alt="" loading="lazy" />` : ""}</div>
        <div class="body">
          <div class="artist">${escapeHtml(listing.artist_name || "Unknown")}</div>
          <div class="title">${escapeHtml(listing.artwork_title || "")}</div>
          <div class="price-row">
            <div>
              <span class="price">$${price}</span>${prev ? `<span class="prev">$${prev}</span>` : ""}
            </div>
            ${catLabel ? `<span class="cat${catCls}">${escapeHtml(catLabel)}</span>` : ""}
          </div>
        </div>`;
      return card;
    }

    function populateOptions(selectEl, values) {
      const seen = new Set();
      const opts = [];
      for (const v of values) {
        if (!v) continue;
        const key = String(v).trim();
        if (!key || seen.has(key)) continue;
        seen.add(key);
        opts.push(key);
      }
      opts.sort((a, b) => a.localeCompare(b));
      // keep the first option (the "All …") and append the rest
      const first = selectEl.querySelector("option");
      selectEl.innerHTML = "";
      if (first) selectEl.appendChild(first);
      for (const o of opts) {
        const opt = document.createElement("option");
        opt.value = o;
        opt.textContent = o;
        selectEl.appendChild(opt);
      }
    }

    function applyFilters() {
      const q     = $q.value.trim().toLowerCase();
      const cat   = $cat.value;
      const stf   = $statusF.value;
      const sel   = $seller.value;
      const art   = $artist.value;
      const minP  = Number($min.value);
      const maxP  = Number($max.value);
      const so    = $sort.value;
      const hasMin = $min.value !== "" && !isNaN(minP);
      const hasMax = $max.value !== "" && !isNaN(maxP);

      let rows = allListings.filter(l => {
        if (cat && l.artwork_category !== cat) return false;
        if (stf === "available" && l.status !== "available") return false;
        if (stf === "sold"      && l.status !== "sold")      return false;
        if (sel && (l.profiles?.display_name || "") !== sel) return false;
        if (art && (l.artist_name || "") !== art) return false;
        const p = Number(l.asking_price_usd || 0);
        if (hasMin && p < minP) return false;
        if (hasMax && p > maxP) return false;
        if (q) {
          const hay = `${l.artist_name || ""} ${l.artwork_title || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      if (so === "price-asc")      rows.sort((a,b) => Number(a.asking_price_usd||0) - Number(b.asking_price_usd||0));
      else if (so === "price-desc") rows.sort((a,b) => Number(b.asking_price_usd||0) - Number(a.asking_price_usd||0));
      else                          rows.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

      // Render
      $grid.innerHTML = "";
      for (const l of rows) $grid.appendChild(renderCard(l));

      $stats.hidden = false;
      $stats.textContent = `Showing ${rows.length} of ${allListings.length} listing${allListings.length === 1 ? "" : "s"}`;
      $grid.hidden  = rows.length === 0;
      $empty.hidden = rows.length !== 0;
    }

    async function loadCatalog() {
      const { data: listings, error } = await supabase
        .from("listings")
        .select(`
          listing_id, artist_name, artwork_title, artwork_category,
          asking_price_usd, previous_price_usd, status, created_at,
          listing_images ( storage_path, position ),
          profiles!listings_seller_id_fkey ( display_name )
        `)
        .eq("moderation_status", "approved")
        .in("status", ["available", "pending", "sold"])
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        $status.textContent = "Could not load the catalog. Please try again later.";
        $status.classList.add("error");
        return;
      }
      if (!listings || listings.length === 0) {
        $status.textContent = "The catalog is empty right now — check back soon.";
        return;
      }
      allListings = listings;
      populateOptions($seller, listings.map(l => l.profiles?.display_name));
      populateOptions($artist, listings.map(l => l.artist_name));
      $status.hidden = true;
      applyFilters();
    }

    [$q, $cat, $statusF, $seller, $artist, $min, $max, $sort]
      .forEach(el => el.addEventListener("input", applyFilters));
    $clear.addEventListener("click", () => {
      $q.value = "";
      $cat.value = "";
      $statusF.value = "";
      $seller.value = "";
      $artist.value = "";
      $min.value = "";
      $max.value = "";
      $sort.value = "newest";
      applyFilters();
    });

    loadCatalog();
  </script>
</body>
</html>
