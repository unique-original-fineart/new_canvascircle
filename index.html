<!doctype html>
<!--
==============================================================================
  CATALOG  (PUBLIC HOMEPAGE — root /index.html)
  ===========================================================================
  This is the file served at:
      https://canvascircle.art/
      https://new-canvascircle.pages.dev/

  *** DO NOT confuse with /portal/index.html ***
  /portal/index.html is the signed-in account portal (sign in, dashboard,
  saved listings, sales-post builder). They share <header>/<footer> for
  consistency but the bodies are completely different.

  If you find yourself copy/pasting and you see "Your listings" or
  "Saved listings" tabs in this file — STOP, you've grabbed the wrong one.
==============================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CanvasCircle™ — A Modern Art Marketplace Built for Social Selling</title>

  <!-- Search engine metadata -->
  <meta name="description" content="CanvasCircle is a modern art marketplace built for social selling. Browse original paintings, limited-edition prints, and resold fine art from independent collectors and artists. Free to use — no commissions, no fees." />
  <meta name="keywords" content="art marketplace, buy art online, original paintings, fine art, limited edition prints, resell art, social selling, art catalog, independent artists, art collectors" />
  <meta name="robots" content="index, follow" />
  <meta name="author" content="CanvasCircle" />
  <link rel="canonical" href="https://canvascircle.art/" />

  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="manifest" href="/assets/manifest.webmanifest" />
  <meta name="theme-color" content="#1a1a1a" />

  <!-- Performance: warm up the TLS + DNS to the Supabase storage host so the
       first image request lands on a ready connection. Shaves ~100ms off
       LCP on cold loads. -->
  <link rel="preconnect" href="https://xwieomjsqwcswoadrvkv.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://xwieomjsqwcswoadrvkv.supabase.co" />

  <!-- Open Graph -->
  <meta property="og:site_name"   content="CanvasCircle" />
  <meta property="og:title"       content="CanvasCircle — A Modern Art Marketplace Built for Social Selling" />
  <meta property="og:description" content="A modern art marketplace built for social selling. Browse original and limited-edition artwork from independent collectors and artists." />
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://canvascircle.art/" />
  <meta property="og:image"       content="https://canvascircle.art/assets/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt"    content="CanvasCircle — A modern art marketplace built for social selling." />

  <!-- Twitter / X -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="CanvasCircle — A Modern Art Marketplace" />
  <meta name="twitter:description" content="A modern art marketplace built for social selling." />
  <meta name="twitter:image"       content="https://canvascircle.art/assets/og-image.png" />

  <!-- Structured data (schema.org) helps Google understand what this page is -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "CanvasCircle",
    "url": "https://canvascircle.art/",
    "description": "A modern art marketplace built for social selling. Browse original and limited-edition artwork from independent collectors and artists.",
    "publisher": {
      "@type": "Organization",
      "name": "CanvasCircle",
      "url": "https://canvascircle.art/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://canvascircle.art/assets/CanvasCircleLogo.png"
      }
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://canvascircle.art/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <style>
    :root {
      --bg:        #faf9f6;
      --fg:        #1a1a1a;
      --muted:     #6b6b6b;
      --accent:    #b8860b;
      --card-bg:   #ffffff;
      --card-line: #e8e4dc;
      --shadow:    0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
      --green:     #2a7a3e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--card-line);
      background: #fff;
      display: flex; align-items: center; justify-content: space-between;
    }
    header .brand { display: flex; align-items: center; gap: 10px; }
    header img    { height: 32px; width: 32px; border-radius: 6px; }
    header .title { font-weight: 600; font-size: 18px; letter-spacing: .2px; }
    nav a { color: var(--fg); text-decoration: none; margin-left: 16px; font-size: 14px; }
    nav a:hover { color: var(--accent); }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 64px;
    }
    .hero {
      text-align: center;
      padding: 14px 16px 14px;
    }
    .hero p.tagline {
      margin: 0; color: var(--muted);
      font-size: 14px; line-height: 1.45;
    }
    .hero p.tagline strong { color: var(--fg); font-weight: 600; }

    /* ---- Filter toolbar ---- */
    .toolbar {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toolbar-row {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr;
    }
    .toolbar-row.search-row {
      grid-template-columns: 1fr auto;
    }
    .toolbar-row.filter-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    /* On wider screens, fit each filter at no less than 150px so labels don't
       get clipped. The grid wraps to a second row if needed instead of
       squeezing everything. */
    @media (min-width: 720px) {
      .toolbar-row.filter-row {
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      }
    }
    .price-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      grid-column: span 2;
    }
    @media (min-width: 720px) {
      .price-pair { grid-column: span 2; min-width: 200px; }
    }
    .toolbar input[type="search"],
    .toolbar input[type="number"],
    .toolbar select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-line);
      background: #fff;
      color: var(--fg);
      font-size: 14px;
      font-family: inherit;
      min-width: 0;          /* let grid items shrink properly */
    }
    /* Use the browser-native dropdown arrow (smaller, well-positioned).
       Just make sure the text doesn't run under it. */
    .toolbar select { padding-right: 24px; }
    .toolbar input[type="number"] { -moz-appearance: textfield; }
    .toolbar input[type="number"]::-webkit-outer-spin-button,
    .toolbar input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .toolbar input:focus,
    .toolbar select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184,134,11,.15);
    }
    .toolbar .clear-btn {
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-line);
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      white-space: nowrap;
    }
    .toolbar .clear-btn:hover {
      color: var(--fg);
      border-color: #ccc;
    }
    .stats {
      color: var(--muted);
      font-size: 13px;
      padding: 0 4px 12px;
    }

    /* ---- Status / empty ---- */
    #status, .empty {
      margin: 24px auto;
      max-width: 540px;
      padding: 16px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--card-line);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    #status.error { color: #a8281f; border-color: #f1c4be; background: #fef6f5; }
    .empty .empty-title { color: var(--fg); font-weight: 600; margin-bottom: 4px; }
    .loading-more {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 16px 12px;
      letter-spacing: .2px;
    }

    /* ---- Grid + cards ---- */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    @media (min-width: 720px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-line);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
    }
    .card .img { aspect-ratio: 1/1; background: #f0ede6; overflow: hidden; position: relative; }
    .card .img img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Heart/save button — sits as a sibling of the card link to avoid
       button-inside-anchor weirdness. The wrap takes the grid slot; the
       link fills it; the heart absolutely-positions itself. */
    .card-wrap { position: relative; }
    .card-wrap .heart-btn {
      position: absolute;
      top: 8px; right: 8px;
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(255,255,255,.92);
      color: #555;
      border: none;
      border-radius: 999px;
      padding: 4px 9px 4px 8px;
      font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      transition: transform .12s ease, background .12s ease;
      z-index: 2;
    }
    .card-wrap .heart-btn:hover { transform: scale(1.06); background: #fff; }
    .card-wrap .heart-btn .heart-glyph { font-size: 14px; line-height: 1; }
    .card-wrap .heart-btn.is-saved { background: #fff; }
    .card-wrap .heart-btn.is-saved .heart-glyph { color: #c93f3f; }
    .card-wrap .heart-btn[disabled] { opacity: .55; cursor: progress; }
    .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
    .card .artist {
      font-weight: 600; font-size: 14px; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    .card .title {
      color: var(--muted); font-size: 13px; line-height: 1.25;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    }
    /* Price + pills row.
       Desktop:  [price ......... pills]   (single row)
       Mobile:   [price]                   (price gets full width)
                 [pills...]                 (pills wrap to row 2) */
    .card .price-row {
      margin-top: 4px;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      flex-wrap: wrap;
    }
    .card .price-row .left  { display: inline-flex; align-items: baseline; gap: 6px; min-width: 0; }
    .card .price-row .pills { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .card .price  { font-weight: 600; font-size: 14px; white-space: nowrap; color: var(--fg); }
    .card .price .ship-suffix { font-weight: 500; font-size: 12px; color: var(--fg); }
    .card .prev   { color: var(--muted); text-decoration: line-through; font-size: 12px; }
    .card .cat    {
      font-size: 10px; font-weight: 700; letter-spacing: .3px;
      padding: 3px 7px; border-radius: 999px;
      background: #efe9d8; color: #6a4c00; border: 1px solid #e3d8b1;
      white-space: nowrap; line-height: 1.2;
    }
    .card .cat.unique     { background: #d6efdf; color: #1f5b32; border-color: #a8d9b8; }
    .card .cat.edition    { background: #d6e6f7; color: #1f4a78; border-color: #a8c8e3; }
    .card .cat.sold       { background: #f3d6d3; color: #8a1f1a; border-color: #e8b3ad; }
    .card .cat.not-renewed{ background: #fff4e2; color: #5a4400; border-color: #f0d6a3; }
    .card .cat.pending-sale{ background: #fce6c4; color: #7a4a00; border-color: #f1c98a; }

    /* Pills always live on their own row below the price — keeps card heights
       uniform whether or not there's a price drop / strikethrough showing. */
    .card .price-row .pills {
      flex: 0 0 100%;
      justify-content: flex-start;
    }
    @media (max-width: 480px) {
      .card .artist { font-size: 13px; }
      .card .title  { font-size: 12px; }
      .card .price  { font-size: 13px; }
      .card .cat    { font-size: 9px; padding: 2px 6px; }
    }
    .card.is-sold .price { color: var(--muted); text-decoration: line-through; }

    /* Show Details CTA — small text at the bottom of the card body so users
       know the card is clickable. The whole card is the link target; this is
       just a visual affordance. */
    .card .cta {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-align: right;
      letter-spacing: .2px;
    }
    .card .cta::after { content: " →"; }
    .card:hover .cta { text-decoration: underline; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 32px 16px;
      border-top: 1px solid var(--card-line);
      background: #fff;
    }

    /* Catalog top-level tabs: For Sale / In Search Of */
    .catalog-tabs {
      display: flex; gap: 4px; margin: 16px 0 12px;
      border-bottom: 1px solid var(--card-line);
    }
    .catalog-tab {
      background: none; border: none; padding: 12px 18px;
      font-family: inherit; font-size: 15px; font-weight: 600;
      color: var(--muted); cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
    }
    .catalog-tab:hover { color: var(--fg); }
    .catalog-tab.is-active {
      color: var(--fg);
      border-bottom-color: var(--accent);
    }
    .catalog-tab .tab-hint { font-weight: 400; color: var(--muted); font-size: 13px; }
    @media (max-width: 540px) {
      .catalog-tab { padding: 10px 12px; font-size: 14px; }
      .catalog-tab .tab-hint { display: none; }
    }

    /* ISO card styling. Reuses .card structure but swaps the price area
       for budget + paints the badge amber instead of green. */
    .card .cat.iso-wanted {
      background: #fff4e2; color: #7a4a00; border-color: #f1c98a;
    }
    .card .iso-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; gap: 4px;
      background: linear-gradient(135deg, #f8f5ee 0%, #efece4 100%);
    }
    .card .iso-placeholder .glyph { font-size: 32px; opacity: .55; }
    .card .iso-placeholder .label { letter-spacing: .3px; }
    .card .iso-budget { font-weight: 600; font-size: 14px; }
    .card .iso-budget .open { font-weight: 400; color: var(--muted); font-size: 13px; }

    /* Back to top */
    #back-to-top {
      position: fixed;
      bottom: 20px; right: 20px;
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--card-line);
      background: #fff;
      color: var(--fg);
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity .15s ease;
    }
    #back-to-top.visible { display: flex; }
    #back-to-top:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/assets/CanvasCircleLogo.png" alt="CanvasCircle" />
      <span class="title">CanvasCircle™</span>
    </div>
    <nav>
      <a href="/">Catalog</a>
      <a href="/portal/" class="cc-auth-link">Log In</a>
      <a href="/guidelines.html">Guidelines</a>
      <a href="/about.html">About</a>
    </nav>
  </header>

  <script type="module" src="/lib/nav-auth.js"></script>

  <main>
    <section class="hero">
      <p class="tagline"><strong>CanvasCircle</strong> — A modern art marketplace for social selling.</p>
    </section>

    <div class="catalog-tabs" role="tablist">
      <button type="button" class="catalog-tab is-active" data-listing-type="sale" role="tab" aria-selected="true">For Sale</button>
      <button type="button" class="catalog-tab" data-listing-type="iso" role="tab" aria-selected="false">In Search Of <span class="tab-hint">— buyer requests</span></button>
    </div>

    <form class="toolbar" id="toolbar" autocomplete="off">
      <div class="toolbar-row search-row">
        <input type="search" id="q" placeholder="Search artist or title&hellip;" />
        <button type="button" class="clear-btn" id="clear">Clear</button>
      </div>
      <div class="toolbar-row filter-row">
        <select id="f-category" title="Category">
          <option value="">All categories</option>
          <option value="Unique/Original">Unique/Original</option>
          <option value="Limited Edition">Limited Edition</option>
        </select>
        <select id="f-status" title="Status">
          <option value="available" selected>Available</option>
          <option value="sold">Sold</option>
          <option value="not_renewed">Not renewed</option>
        </select>
        <select id="f-seller" title="Seller">
          <option value="">All sellers</option>
        </select>
        <select id="f-artist" title="Artist">
          <option value="">All artists</option>
        </select>
        <div class="price-pair">
          <input type="number" id="f-min" placeholder="Min $" min="0" step="50" />
          <input type="number" id="f-max" placeholder="Max $" min="0" step="50" />
        </div>
        <select id="f-sort" title="Sort">
          <option value="newest">Newest first</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
        </select>
      </div>
    </form>

    <div id="stats" class="stats" hidden></div>
    <div id="status">Loading catalog&hellip;</div>
    <div id="grid" class="grid" hidden></div>
    <div id="loading-more" class="loading-more" hidden>Loading more listings&hellip;</div>
    <div id="sentinel" aria-hidden="true" style="height: 1px;"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-title">No listings match your filters</div>
      <div>Try clearing one or two of them.</div>
    </div>
  </main>

  <button type="button" id="back-to-top" aria-label="Back to top" hidden>↑</button>

  <footer>
    &copy; CanvasCircle.
    <a href="/about.html" style="color:inherit;">About</a> &middot;
    <a href="/guidelines.html" style="color:inherit;">Guidelines</a> &middot;
    <a href="/terms.html" style="color:inherit;">Terms</a> &middot;
    <a href="/privacy.html" style="color:inherit;">Privacy</a> &middot;
    <a href="/portal/" style="color:inherit;" class="cc-auth-link">Log In</a>
  </footer>

  <script type="module">
    import { supabase, publicImageUrl } from "/lib/supabase.js";
    import { getCurrentUserSaves, toggleSave } from "/lib/saves.js";
    import { showAuthPrompt } from "/lib/auth-prompt.js";

    const $status   = document.getElementById("status");
    const $grid     = document.getElementById("grid");
    const $empty    = document.getElementById("empty");
    const $stats    = document.getElementById("stats");
    const $sentinel = document.getElementById("sentinel");
    const $back     = document.getElementById("back-to-top");
    const $q        = document.getElementById("q");
    const $cat      = document.getElementById("f-category");
    const $statusF  = document.getElementById("f-status");
    const $seller   = document.getElementById("f-seller");
    const $artist   = document.getElementById("f-artist");
    const $min      = document.getElementById("f-min");
    const $max      = document.getElementById("f-max");
    const $sort     = document.getElementById("f-sort");
    const $clear    = document.getElementById("clear");

    const PAGE_SIZE = 24;

    // Server-side pagination state. We no longer hold the full catalog in
    // memory — only the pages we've fetched so far. Filtering and sorting
    // both happen server-side (PostgREST), so each filter change re-queries
    // the server starting at page 0.
    let listings      = [];       // currently loaded rows (accumulates as pages load)
    let totalCount    = 0;        // total matching the active filters on the server
    let loadedCount   = 0;        // length of `listings` (kept in sync)
    let isFetching    = false;    // prevent concurrent fetches
    let currentFilters = null;    // snapshot of filter values for the active query
    let userSavesSet  = null;     // Set<listing_id> of saves for current user, or null if unsigned
    let currentTab    = "sale";   // "sale" | "iso" — top-level catalog tab

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      }[c]));
    }

    function renderCard(listing) {
      const isIso = listing.listing_type === "iso";
      const images = (listing.listing_images || []).slice().sort((a,b) => a.position - b.position);
      const firstPath = images[0]?.storage_path;
      const wrap = document.createElement("div");
      wrap.className = "card-wrap";
      wrap.dataset.listingId = listing.listing_id;
      const card = document.createElement("a");
      card.className = "card" + (listing.status === "sold" ? " is-sold" : "");
      card.href = `/listing.html?id=${listing.listing_id}`;
      const imgUrl = firstPath ? publicImageUrl(firstPath) : "";
      const catCls   = listing.artwork_category === "Unique/Original" ? " unique"
                     : listing.artwork_category === "Limited Edition" ? " edition" : "";
      const catLabel = listing.artwork_category || "";
      const saved    = !!(userSavesSet && userSavesSet.has(listing.listing_id));
      const saveN    = Number(listing.save_count || 0);

      // Image cell: ISO listings often have no image — show a friendly placeholder.
      const imgInner = imgUrl
        ? `<img src="${imgUrl}" alt="${escapeHtml(listing.artist_name || "")} — ${escapeHtml(listing.artwork_title || "")}" loading="lazy" decoding="async" />`
        : (isIso
            ? `<div class="iso-placeholder"><span class="glyph">🔍</span><span class="label">In Search Of</span></div>`
            : "");

      // Header row: artist + title. ISO is allowed to have only one of the two.
      const artistLine = listing.artist_name ? escapeHtml(listing.artist_name)
                       : (isIso ? `<span style="color:var(--muted);font-style:italic;">Any artist</span>` : "Unknown");
      const titleLine  = listing.artwork_title ? escapeHtml(listing.artwork_title)
                       : (isIso ? `<span style="color:var(--muted);font-style:italic;">Title unspecified</span>` : "");

      // Price / budget row.
      let priceRow;
      if (isIso) {
        const min = listing.budget_min_usd != null ? Number(listing.budget_min_usd) : null;
        const max = listing.budget_max_usd != null ? Number(listing.budget_max_usd) : null;
        let budgetLabel;
        if (min != null && max != null)        budgetLabel = `$${min.toLocaleString()}–$${max.toLocaleString()}`;
        else if (min != null)                  budgetLabel = `From $${min.toLocaleString()}`;
        else if (max != null)                  budgetLabel = `Up to $${max.toLocaleString()}`;
        else                                   budgetLabel = `<span class="open">Open budget</span>`;
        priceRow = `
          <div class="price-row">
            <span class="left">
              <span class="iso-budget">${budgetLabel}</span>
            </span>
            <span class="pills">
              <span class="cat iso-wanted">WANTED</span>
              ${catLabel ? `<span class="cat${catCls}">${escapeHtml(catLabel)}</span>` : ""}
            </span>
          </div>`;
      } else {
        const price  = Number(listing.asking_price_usd || 0).toLocaleString();
        const prev   = listing.previous_price_usd
                        && Number(listing.previous_price_usd) > Number(listing.asking_price_usd)
                        ? Number(listing.previous_price_usd).toLocaleString()
                        : null;
        const isSold       = listing.status === "sold";
        const isNotRenewed = listing.status === "not_renewed";
        const isPending    = listing.status === "pending";
        const shipSuffix = (!isSold && !isNotRenewed)
          ? (listing.shipping_offered === "Yes" ? " shipped" : " + shipping")
          : "";
        priceRow = `
          <div class="price-row">
            <span class="left">
              <span class="price">$${price}<span class="ship-suffix">${shipSuffix}</span></span>${prev ? `<span class="prev">$${prev}</span>` : ""}
            </span>
            <span class="pills">
              ${isSold ? `<span class="cat sold">SOLD</span>` : ""}
              ${isNotRenewed ? `<span class="cat not-renewed">NOT RENEWED</span>` : ""}
              ${isPending ? `<span class="cat pending-sale">PENDING SALE</span>` : ""}
              ${catLabel ? `<span class="cat${catCls}">${escapeHtml(catLabel)}</span>` : ""}
            </span>
          </div>`;
      }

      card.innerHTML = `
        <div class="img">${imgInner}</div>
        <div class="body">
          <div class="artist">${artistLine}</div>
          <div class="title">${titleLine}</div>
          ${priceRow}
          <div class="cta">${isIso ? "See request" : "Show details"}</div>
        </div>`;
      const heart = document.createElement("button");
      heart.type = "button";
      heart.className = "heart-btn" + (saved ? " is-saved" : "");
      heart.setAttribute("aria-label", saved ? "Unsave" : "Save listing");
      heart.innerHTML = `<span class="heart-glyph">${saved ? "♥" : "♡"}</span><span class="heart-count">${saveN}</span>`;
      wrap.appendChild(card);
      wrap.appendChild(heart);
      return wrap;
    }

    // Event delegation: heart clicks anywhere in the grid
    async function onHeartClick(btn) {
      const wrap = btn.closest(".card-wrap");
      if (!wrap) return;
      const id = wrap.dataset.listingId;
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        showAuthPrompt({ message: "Sign up to save listings. Same account also lets you sell — no commitment." });
        return;
      }
      btn.disabled = true;
      const $glyph = btn.querySelector(".heart-glyph");
      const $count = btn.querySelector(".heart-count");
      const wasSaved = btn.classList.contains("is-saved");
      // Optimistic UI
      btn.classList.toggle("is-saved", !wasSaved);
      $glyph.textContent = !wasSaved ? "♥" : "♡";
      $count.textContent = String(Math.max(0, Number($count.textContent || 0) + (wasSaved ? -1 : 1)));
      try {
        const nowSaved = await toggleSave(id);
        // Sync the in-memory listing record so re-renders are correct
        const rec = listings.find(l => l.listing_id === id);
        if (rec) {
          rec.save_count = Math.max(0, Number(rec.save_count || 0) + (nowSaved ? 1 : -1));
        }
      } catch (err) {
        console.error("[heart] toggle failed:", err);
        // Revert
        btn.classList.toggle("is-saved", wasSaved);
        $glyph.textContent = wasSaved ? "♥" : "♡";
        $count.textContent = String(Math.max(0, Number($count.textContent || 0) + (wasSaved ? 1 : -1)));
      } finally {
        btn.disabled = false;
      }
    }

    function populateOptions(selectEl, values) {
      const seen = new Set();
      const opts = [];
      for (const v of values) {
        if (!v) continue;
        const key = String(v).trim();
        if (!key || seen.has(key)) continue;
        seen.add(key);
        opts.push(key);
      }
      opts.sort((a, b) => a.localeCompare(b));
      // keep the first option (the "All …") and append the rest
      const first = selectEl.querySelector("option");
      selectEl.innerHTML = "";
      if (first) selectEl.appendChild(first);
      for (const o of opts) {
        const opt = document.createElement("option");
        opt.value = o;
        opt.textContent = o;
        selectEl.appendChild(opt);
      }
    }

    // Build a Supabase query with all filter/sort/status constraints applied
    // server-side. Returns a thenable PostgREST query (call `.range()` then
    // await it). `count: "exact"` adds a Content-Range total header.
    function buildCatalogQuery(filters) {
      const tab = filters.tab || "sale";
      let q = supabase
        .from("listings")
        .select(`
          listing_id, listing_type, artist_name, artwork_title, artwork_category,
          asking_price_usd, previous_price_usd, budget_min_usd, budget_max_usd,
          status, created_at, save_count, shipping_offered,
          listing_images ( storage_path, position ),
          profiles!listings_seller_id_fkey!inner ( display_name, account_status )
        `, { count: "exact" })
        .eq("listing_type", tab)
        .eq("moderation_status", "approved")
        .eq("profiles.account_status", "active");

      if (tab === "iso") {
        // ISO listings are always "available" — sold/not_renewed don't apply.
        q = q.eq("status", "available");
      } else {
        // Sale listings — status filter from the dropdown.
        const status = filters.statusF === "sold" ? "sold"
                     : filters.statusF === "not_renewed" ? "not_renewed"
                     : "available";
        q = q.eq("status", status);
      }

      if (filters.cat)    q = q.eq("artwork_category", filters.cat);
      if (filters.seller) q = q.eq("profiles.display_name", filters.seller);
      if (filters.artist) q = q.eq("artist_name", filters.artist);

      // Price/budget filter — column depends on the tab. For ISO we filter by
      // budget_max (so "max $500" finds requests willing to pay up to $500+).
      if (tab === "iso") {
        if (filters.min !== "" && !isNaN(Number(filters.min))) q = q.gte("budget_max_usd", Number(filters.min));
        if (filters.max !== "" && !isNaN(Number(filters.max))) q = q.lte("budget_min_usd", Number(filters.max));
      } else {
        if (filters.min !== "" && !isNaN(Number(filters.min))) q = q.gte("asking_price_usd", Number(filters.min));
        if (filters.max !== "" && !isNaN(Number(filters.max))) q = q.lte("asking_price_usd", Number(filters.max));
      }

      if (filters.q) {
        // Escape PostgREST `or` value separators (comma + paren) and wildcard chars.
        const pat = filters.q.replace(/[%_]/g, "\\$&");
        q = q.or(`artist_name.ilike.%${pat}%,artwork_title.ilike.%${pat}%`);
      }

      const priceCol = tab === "iso" ? "budget_max_usd" : "asking_price_usd";
      if (filters.sort === "price-asc")       q = q.order(priceCol, { ascending: true,  nullsFirst: false });
      else if (filters.sort === "price-desc") q = q.order(priceCol, { ascending: false, nullsFirst: false });
      else                                    q = q.order("created_at", { ascending: false });

      return q;
    }

    function snapshotFilters() {
      return {
        tab:     currentTab,
        q:       $q.value.trim(),
        cat:     $cat.value,
        statusF: $statusF.value,
        seller:  $seller.value,
        artist:  $artist.value,
        min:     $min.value,
        max:     $max.value,
        sort:    $sort.value,
      };
    }

    function statusLabelForFilters(f) {
      if (f.tab === "iso") return "open";
      return f.statusF === "sold" ? "sold" : f.statusF === "not_renewed" ? "not renewed" : "available";
    }

    function updateStatsBar() {
      $stats.hidden = false;
      const statusName = statusLabelForFilters(currentFilters);
      const noun = currentFilters.tab === "iso" ? "request" : "listing";
      $stats.textContent =
        `Showing ${loadedCount} of ${totalCount} ${statusName} ${noun}${totalCount === 1 ? "" : "s"}`;
    }

    function renderRows(rows) {
      const frag = document.createDocumentFragment();
      for (const r of rows) frag.appendChild(renderCard(r));
      $grid.appendChild(frag);
    }

    // Run on initial load and on every filter change. Resets to page 0.
    async function applyFilters() {
      if (isFetching) return;
      currentFilters = snapshotFilters();
      listings      = [];
      loadedCount   = 0;
      totalCount    = 0;
      $grid.innerHTML = "";
      $empty.hidden = true;
      $grid.hidden  = true;
      isFetching = true;
      try {
        const { data, count, error } = await buildCatalogQuery(currentFilters).range(0, PAGE_SIZE - 1);
        if (error) throw error;
        listings    = data || [];
        loadedCount = listings.length;
        totalCount  = count || 0;
        renderRows(listings);
        $grid.hidden  = totalCount === 0;
        $empty.hidden = totalCount !== 0;
        updateStatsBar();
      } catch (err) {
        console.error("[applyFilters] failed:", err);
        $status.textContent = "Could not load the catalog. Please try again later.";
        $status.classList.add("error");
        $status.hidden = false;
      } finally {
        isFetching = false;
      }
    }

    // Fetch the next page of currently-active filters. Triggered by the
    // sentinel scroll observer. No-ops if a fetch is in flight or there's
    // nothing left to load.
    async function loadMore() {
      if (isFetching || !currentFilters || loadedCount >= totalCount) return;
      isFetching = true;
      const $loadingMore = document.getElementById("loading-more");
      if ($loadingMore) $loadingMore.hidden = false;
      try {
        const start = loadedCount;
        const end   = loadedCount + PAGE_SIZE - 1;
        const { data, error } = await buildCatalogQuery(currentFilters).range(start, end);
        if (error) throw error;
        const rows = data || [];
        if (rows.length === 0) return;
        listings    = listings.concat(rows);
        loadedCount = listings.length;
        renderRows(rows);
        updateStatsBar();
      } catch (err) {
        console.error("[loadMore] failed:", err);
      } finally {
        isFetching = false;
        if ($loadingMore) $loadingMore.hidden = true;
      }
    }

    // Populate the seller + artist dropdowns. Re-runs on each tab switch so
    // the options reflect what's actually available on that tab.
    async function populateDropdowns() {
      const tab = currentTab;
      const [sellersResp, artistsResp] = await Promise.all([
        supabase
          .from("listings")
          .select("profiles!listings_seller_id_fkey!inner ( display_name, account_status )")
          .eq("listing_type", tab)
          .eq("moderation_status", "approved")
          .eq("profiles.account_status", "active"),
        supabase
          .from("listings")
          .select("artist_name")
          .eq("listing_type", tab)
          .eq("moderation_status", "approved"),
      ]);
      const sellerNames = [...new Set(
        (sellersResp.data || []).map(r => r.profiles?.display_name).filter(Boolean)
      )].sort((a,b) => a.localeCompare(b));
      const artistNames = [...new Set(
        (artistsResp.data || []).map(r => r.artist_name).filter(Boolean)
      )].sort((a,b) => a.localeCompare(b));
      // Seller dropdown is renamed "Buyer" on ISO tab — option text stays the same,
      // only the first-option label differs.
      const firstSellerOpt = $seller.querySelector("option");
      if (firstSellerOpt) firstSellerOpt.textContent = tab === "iso" ? "All buyers" : "All sellers";
      populateOptions($seller, sellerNames);
      populateOptions($artist, artistNames);
    }

    // Show / hide / relabel toolbar pieces depending on which tab is active.
    function applyTabUiMode() {
      const isIso = currentTab === "iso";
      // Status filter doesn't apply to ISO (no sold/not_renewed states).
      $statusF.hidden = isIso;
      $statusF.disabled = isIso;
      // Price-pair labels swap to "budget" framing on the ISO tab.
      $min.placeholder = isIso ? "Min budget $" : "Min $";
      $max.placeholder = isIso ? "Max budget $" : "Max $";
      $seller.title    = isIso ? "Buyer"        : "Seller";
      // Update tab button aria/active state to match currentTab.
      document.querySelectorAll(".catalog-tab").forEach(btn => {
        const active = btn.dataset.listingType === currentTab;
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-selected", active ? "true" : "false");
      });
      // Update placeholder copy on the empty-state for ISO clarity.
      const emptyTitle = document.querySelector("#empty .empty-title");
      if (emptyTitle) emptyTitle.textContent = isIso
        ? "No open requests match your filters"
        : "No listings match your filters";
    }

    async function loadCatalog() {
      userSavesSet = await getCurrentUserSaves();
      restoreFilterState(); // pull saved filters (incl. tab) from sessionStorage if present
      applyTabUiMode();
      await populateDropdowns();
      $status.hidden = true;
      await applyFilters();
      if (totalCount === 0 && !$q.value && !$cat.value && !$seller.value && !$artist.value && !$min.value && !$max.value) {
        // Truly empty catalog (not just zero-match filters).
        $status.hidden = false;
        $status.textContent = currentTab === "iso"
          ? "No open buyer requests yet — check back soon."
          : "The catalog is empty right now — check back soon.";
      }
    }

    // ----- Persistent filter state (sessionStorage) -----
    const FILTER_KEY = "cc_catalog_filters";
    function saveFilterState() {
      try {
        sessionStorage.setItem(FILTER_KEY, JSON.stringify({
          tab: currentTab,
          q: $q.value, cat: $cat.value, statusF: $statusF.value,
          seller: $seller.value, artist: $artist.value,
          min: $min.value, max: $max.value, sort: $sort.value,
        }));
      } catch (e) { /* private mode etc — ignore */ }
    }
    function restoreFilterState() {
      try {
        const raw = sessionStorage.getItem(FILTER_KEY);
        if (!raw) return;
        const s = JSON.parse(raw);
        if (s.tab === "iso" || s.tab === "sale") currentTab = s.tab;
        if (s.q       != null) $q.value       = s.q;
        if (s.cat     != null) $cat.value     = s.cat;
        if (s.statusF != null) $statusF.value = s.statusF;
        if (s.seller  != null) $seller.value  = s.seller;
        if (s.artist  != null) $artist.value  = s.artist;
        if (s.min     != null) $min.value     = s.min;
        if (s.max     != null) $max.value     = s.max;
        if (s.sort    != null) $sort.value    = s.sort;
      } catch (e) { /* ignore */ }
    }
    function clearFilterState() {
      try { sessionStorage.removeItem(FILTER_KEY); } catch (e) {}
    }

    // Tab switching — clears seller/artist (they're tab-specific) and resets
    // status filter, then re-populates dropdowns and re-runs filters.
    async function switchTab(newTab) {
      if (newTab !== "sale" && newTab !== "iso") return;
      if (newTab === currentTab) return;
      currentTab = newTab;
      // These filter values are tab-specific — values from the other tab won't
      // exist in this tab's option list, so clear them.
      $seller.value = "";
      $artist.value = "";
      $statusF.value = "available";
      applyTabUiMode();
      saveFilterState();
      await populateDropdowns();
      await applyFilters();
    }

    document.querySelectorAll(".catalog-tab").forEach(btn => {
      btn.addEventListener("click", () => switchTab(btn.dataset.listingType));
    });

    // Heart click delegation
    document.getElementById("grid").addEventListener("click", (e) => {
      const btn = e.target.closest(".heart-btn");
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        onHeartClick(btn);
      }
    });

    // Text + number inputs debounce so each keystroke doesn't fire a request.
    // Selects fire immediately (they only change on commit).
    let filterDebounce = null;
    function debouncedApply() {
      saveFilterState();
      clearTimeout(filterDebounce);
      filterDebounce = setTimeout(applyFilters, 250);
    }
    [$q, $min, $max].forEach(el => el.addEventListener("input", debouncedApply));
    [$cat, $statusF, $seller, $artist, $sort].forEach(el => {
      el.addEventListener("change", () => { saveFilterState(); applyFilters(); });
    });
    $clear.addEventListener("click", () => {
      $q.value = "";
      $cat.value = "";
      $statusF.value = "available";
      $seller.value = "";
      $artist.value = "";
      $min.value = "";
      $max.value = "";
      $sort.value = "newest";
      clearFilterState();
      applyFilters();
    });

    // Infinite scroll — observe the sentinel below the grid and pull the
    // next page of listings from the server when nearing the bottom.
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) loadMore();
        }
      }, { rootMargin: "600px 0px" });
      io.observe($sentinel);
    } else {
      // Fallback for very old browsers.
      window.addEventListener("scroll", () => {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 800) {
          loadMore();
        }
      });
    }

    // Back-to-top button
    function onScroll() {
      if (window.scrollY > 400) $back.classList.add("visible");
      else                       $back.classList.remove("visible");
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    $back.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    loadCatalog();
  </script>
</body>
</html>
